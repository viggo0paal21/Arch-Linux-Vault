font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font ExtraBold
cursor_shape beam
cursor_blink_interval 0
cursor_trail 3
cursor_trail_start_threshold 0
background_opacity 0.65
# qs-glass: opacity can be changed live (Quickshell App opacity)
dynamic_background_opacity yes
modify_font cell_height 110%
font_size 12.0
text_composition_strategy 1.0 20
cursor_trail_decay 0.12 0.48
click_interval 0.1
# Starts zsh through a small wrapper that can show fastfetch first
# (on/off: Quickshell Settings > Commands > "Fastfetch in kitty")
shell /home/viggo/.local/bin/kitty-shell/zsh
