# hyprlock in the style of the shell (oled-bw): glass like the panels (screen blurred, 65 % black on top),
# Inter like the menus, white and two greys, corners like the windows (10 px), no circles.
# Profile picture = the shared account picture (KDE Plasma, SDDM, Quickshell > Settings > System > Profile).
# Name = display name from Quickshell (System > Profile), without Quickshell the account name.
# Plain black instead of glass: comment out the line "path = screenshot" in the background block with #.
# Old look: hyprlock.conf.bak-rice

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Smooth fade in and out, curve like "Smooth out" in the shell
animations {
    enabled = true
    bezier = smoothOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3, smoothOut
    animation = fadeOut, 1, 2, smoothOut
    animation = inputFieldDots, 1, 2, smoothOut
    animation = inputFieldColors, 1, 3, smoothOut
    animation = inputFieldWidth, 1, 3, smoothOut
    animation = inputFieldFade, 1, 3, smoothOut
}

background {
    monitor =
    path = screenshot
    color = rgb(0, 0, 0)
    blur_passes = 3
    blur_size = 7
    # 0.35 = 65 % black on top, like the opacity of the panels
    brightness = 0.35
    contrast = 0.8916
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
    noise = 0.0117
}

# Clock: big and thin like in the dashboard
label {
    monitor =
    text = $TIME
    font_family = Inter Light
    font_size = 72
    color = rgb(255, 255, 255)
    position = 0, 250
    halign = center
    valign = center
}

# Date in English, like in the dashboard ("Wednesday, November 18")
label {
    monitor =
    text = cmd[update:60000] LC_ALL=C date +"%A, %B %-d"
    font_family = Inter SemiBold
    font_size = 13
    color = rgb(212, 212, 212)
    position = 0, 168
    halign = center
    valign = center
}

# Profile picture: rounded square with a fine light edge
image {
    monitor =
    path = /var/lib/AccountsService/icons/viggo
    size = 104
    rounding = 10
    border_size = 1
    border_color = rgba(255, 255, 255, 0.18)
    position = 0, 20
    halign = center
    valign = center
}

# Name below the picture
label {
    monitor =
    text = cmd[update:0] cat ~/.local/state/quickshell/by-shell/oled-bw/user-name 2>/dev/null || id -un
    font_family = Inter SemiBold
    font_size = 14
    color = rgb(255, 255, 255)
    position = 0, -60
    halign = center
    valign = center
}

# Password: dark field with a fine light edge, dots as real circles
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.18)
    inner_color = rgba(0, 0, 0, 0.55)
    font_color = rgb(255, 255, 255)
    font_family = Inter SemiBold
    rounding = 7
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    # -1 = circle
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##a3a3a3">Password</span>
    fail_text = <span foreground="##d4d4d4">Wrong password</span>
    check_color = rgba(255, 255, 255, 0.45)
    fail_color = rgba(255, 255, 255, 0.85)
    capslock_color = rgba(255, 255, 255, 0.6)
    hide_input = false
    position = 0, -125
    halign = center
    valign = center
}
