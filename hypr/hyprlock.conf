background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

# Profilbild ganz nach oben geschoben
image {
    monitor =
    path = /home/viggo/.config/hypr/avatar.png
    size = 240          # Etwas handlicher, damit alles perfekt auf den Bildschirm passt
    rounding = 0
    border_size = 1
    border_color = rgb(26, 26, 26)
    position = 0, 170   # Weit oben zentriert
    halign = center
    valign = center
}

# Benutzername direkt unter dem Bild mit großem 'V'
label {
    monitor =
    text = Viggo
    font_family = Adwaita Mono
    font_size = 16
    color = rgb(255, 255, 255)
    position = 0, 20    # Genau im Zwischenraum unter dem Bild
    halign = center
    valign = center
}

# Passwort-Eingabefeld weiter unten
input-field {
    monitor =
    size = 300, 55
    outline_thickness = 1
    dots_size = 0.28
    dots_spacing = 0.15 
    dots_center = true
    dots_text_format = ■
    fade_on_empty = false
    font_family = Adwaita Mono
    font_size = 14
    font_color = rgb(255, 255, 255)
    inner_color = rgb(0, 0, 0)
    outer_color = rgb(26, 26, 26)
    placeholder_text = Password...
    hide_input = false
    rounding = 0
    position = 0, -80   # Klarer Abstand nach unten zum Passwortfeld
    halign = center
    valign = center
}
