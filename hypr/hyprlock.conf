# hyprlock: simple base version (black background, password field in the center).
# Without any file hyprlock may show no password field, so this minimal version.
# Old AI version: hyprlock.conf.bak-ai

background {
    color = rgba(000000ff)
}

input-field {
    size     = 300, 50
    position = 0, 0
    halign   = center
    valign   = center
}
