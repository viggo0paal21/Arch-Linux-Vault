# hyprlock: Sperrbildschirm passend zum Rice und zum SDDM-Theme "rice"
# (~/.config/sddm/rice/Main.qml, gleiches Layout und gleiche Abstaende).
# Schwarz-weiss, Noto Sans, Flaechen 80 % Schwarz, 1-px-Rand 15 % Weiss, Ecken 10 px.
# Positionen: von der Bildschirmmitte aus, positives y = nach oben.
# Vorherige Version: hyprlock.conf.bak-theme

general {
    ignore_empty_input = true   # Enter ohne Passwort zaehlt nicht als Fehlversuch
}

animations {
    enabled = true
    bezier = smoothOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, smoothOut
    animation = fadeOut, 1, 4, smoothOut
    animation = inputFieldDots, 1, 2, smoothOut
}

# Hintergrund: dasselbe Bild wie im SDDM-Theme, geblurrt und abgedunkelt
background {
    path = /home/viggo/.config/sddm/rice/background.jpg
    blur_passes = 3
    blur_size = 6
    brightness = 0.6            # 40 % dunkler, wie dim=0.4 im SDDM-Theme
    contrast = 1.0
    vibrancy = 0
    noise = 0
}

# Uhr
label {
    text = $TIME
    font_family = Noto Sans Light
    font_size = 90
    color = rgba(255, 255, 255, 1.0)
    position = 0, 270
    halign = center
    valign = center
}

# Datum (englisch wie die Waybar-Uhr)
label {
    text = cmd[update:60000] LC_ALL=C date +"%A, %d.%m."
    font_family = Noto Sans
    font_size = 15
    color = rgba(255, 255, 255, 0.75)
    position = 0, 185
    halign = center
    valign = center
}

# Profilbild: abgerundetes Quadrat mit Haarlinie
image {
    path = /home/viggo/.config/hypr/avatar.png
    size = 96
    rounding = 10
    border_size = 1
    border_color = rgba(255, 255, 255, 0.15)
    position = 0, 30
    halign = center
    valign = center
}

# Name aus dem Konto (GECOS, bei dir "Viggo")
label {
    text = $DESC
    font_family = Noto Sans
    font_size = 14
    color = rgba(255, 255, 255, 1.0)
    position = 0, -42
    halign = center
    valign = center
}

# Passwortfeld
input-field {
    size = 320, 44
    rounding = 10
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(0, 0, 0, 0.8)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = Noto Sans
    check_color = rgba(255, 255, 255, 0.4)     # Rand waehrend der Pruefung
    fail_color = rgba(255, 255, 255, 0.4)      # schwarz-weiss, kein Rot
    capslock_color = rgba(255, 255, 255, 0.4)
    placeholder_text = <span fgalpha="75%">Password</span>
    fail_text = <span fgalpha="75%">Wrong password</span>
    fade_on_empty = false
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1                          # echte Kreise
    position = 0, -110
    halign = center
    valign = center
}
