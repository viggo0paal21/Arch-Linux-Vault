# SDDM: login theme "rice" (folder sddm/rice in this vault -> /usr/share/sddm/themes/rice)
# Careful: /etc/sddm.conf wins over this folder. install.sh fixes Current= and the keyboard lines there too.
[Theme]
Current=rice

[General]
# no virtual keyboard on the login screen (my old theme "silent" had switched it on)
InputMethod=
